version: '3.8'

services:
  # Backend API تجريبي لاختبار مسارات REST
  mock-backend:
    image: kennethreitz/httpbin
    container_name: mock-backend
    ports:
      - "8080:80"

  # WSO2 API Manager
  wso2-am:
    image: wso2/wso2am:latest
    container_name: wso2-am
    ports:
      - "9443:9443"  # Management Consoles (Publisher & DevPortal)
      - "8243:8243"  # Gateway HTTPS
      - "8280:8280"  # Gateway HTTP
    environment:
      - JAVA_OPTS=-Xms1024m -Xmx2048m
    depends_on:
      - mock-backend